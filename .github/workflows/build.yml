name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld make git curl xz-utils libplist-dev libssl-dev zlib1g-dev cmake
          echo "--- versions ---"
          clang --version | head -1 || true
          (ld64.lld --version 2>/dev/null || lld --version) | head -1 || true
          ls -l /usr/bin/ld64.lld /usr/bin/lld 2>/dev/null || true

      - name: Build ldid
        run: |
          set +e
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          make -j$(nproc) 2>&1 | tail -8
          if [ -f /tmp/ldid/ldid ]; then
            sudo install -m755 /tmp/ldid/ldid /usr/local/bin/ldid
            echo "ldid=source"
          else
            printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ldid >/dev/null
            sudo chmod +x /usr/local/bin/ldid
            echo "ldid=noop-fallback"
          fi
          ldid -h 2>&1 | head -2

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true
          ls $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Link linux toolchain into Theos
        run: |
          BIN=$HOME/theos/toolchain/linux/iphone/bin
          mkdir -p $BIN
          for t in clang clang++ gcc g++ make; do
            w=$(command -v $t); [ -n "$w" ] && ln -sf "$(readlink -f $w)" "$BIN/$t"
          done
          for t in ar ranlib nm strip objcopy objdump size; do
            w=$(command -v llvm-$t || command -v $t)
            [ -n "$w" ] && ln -sf "$(readlink -f $w)" "$BIN/$t"
          done
          LD64=$(command -v ld64.lld || command -v lld)
          ln -sf "$(readlink -f $LD64)" "$BIN/ld"
          ln -sf "$(readlink -f $LD64)" "$BIN/ld64"
          ln -sf /usr/local/bin/ldid "$BIN/ldid"
          ls -l $BIN

      - name: Build
        run: |
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 2>&1 | tail -60

      - name: Collect
        if: always()
        run: |
          mkdir -p dist out
          cp packages/*.deb dist/ 2>/dev/null || true
          find .theos -name "SutuDump.dylib" -exec cp {} out/ \; 2>/dev/null || true
          ls -lR dist out 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SutuDump-build
          path: |
            dist/*.deb
            out/*.dylib
            packages/*.deb
          if-no-files-found: warn
