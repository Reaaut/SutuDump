name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git curl xz-utils libplist-dev libssl-dev zlib1g-dev
          clang --version | head -1
          ls -l /usr/bin/ld64.lld /usr/bin/lld 2>/dev/null || true
          sudo ln -sf "$(readlink -f $(which ld64.lld 2>/dev/null || which lld))" /usr/local/bin/arm64-apple-darwin-ld || true
          /usr/local/bin/arm64-apple-darwin-ld --version 2>&1 | head -2 || true

      - name: Install ldid (from source)
        run: |
          git clone --depth 1 --recursive https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          sed -i 's/^MACOS//' Makefile 2>/dev/null || true
          make -j$(nproc) 2>&1 | tail -20 || true
          sudo cp ldid /usr/local/bin/ldid 2>/dev/null || true
          sudo chmod +x /usr/local/bin/ldid 2>/dev/null || true
          ldid -h 2>&1 | head -3 || echo "ldid unavailable (will build unsigned)"

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
          tar xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true
          ls $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          make clean || true
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 TARGET_CODESIGN=ldid TARGET_LD=ld64.lld 2>&1 | tail -60

      - name: Collect
        if: always()
        run: |
          mkdir -p dist out
          cp packages/*.deb dist/ 2>/dev/null || true
          find .theos -name "SutuDump.dylib" -exec cp {} out/ \; 2>/dev/null || true
          ls -lR dist out 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SutuDump-build
          path: |
            dist/*.deb
            out/*.dylib
            packages/*.deb
          if-no-files-found: warn
